name: Phase 1 verification
on:
  push:
    branches: [main, phase-1]
  pull_request:
    paths:
      - 'Phase1/**'
      - 'Makefile'
      - '.github/workflows/phase1.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RTL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Correctness and three-policy RTL benchmarks
        run: make all
      - name: Generic synthesis check
        run: make synth
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-evidence
          path: Phase1/build/
